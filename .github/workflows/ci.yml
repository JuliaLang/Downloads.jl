name: CI
on:
  pull_request:
    branches:
      - master
      - release-*
  push:
    branches:
      - master
      - release-*
    tags: '*'
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.6'
          - '1.10'
          - '1' # automatically expands to the latest stable 1.x release of Julia.
          - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest # Apple Silicon
          - macos-26-intel # Intel
          - windows-latest
        word-size:
          - 32
          - 64
        exclude:
          # 32-bit builds of Julia are not available on Apple Silicon macOS
          - os: macos-latest
            word-size: 32
          # 32-bit builds of Julia are not available on Intel macOS
          - os: macos-26-intel
            word-size: 32
          # Julia 1.6 does not have native builds for Apple Silicon macOS
          - os: macos-latest
            version: '1.6'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ (matrix.word-size == 32) && 'x86' || runner.arch }}
      - uses: julia-actions/cache@v3
      - run: julia --color=yes .ci/test_and_change_uuid.jl
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          file: lcov.info
